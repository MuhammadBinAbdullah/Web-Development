<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>

body {
    background-color: lightblue;
}

.text1 {
    color: red;
    text-decoration: overline;
}

.text2 {
    color: #71ffb0;
    text-decoration: line-through;
}

.text3 {
    color: rgb(70, 98, 120);
    text-decoration: underline;
}

.input-field {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  margin-bottom: 20px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-family: Arial, sans-serif;
  font-size: 1em;
}


</style>
</head>
  <body>
     <h1 class="text1">Bank App</h1>

     <label for="number" class="text3">Enter Transaction Amount</label>
      <input
        type="number"
        id="age"
        required
        min="1000"
        max="50000"
        placeholder="Enter Your Amount"
        class="input-field"
  
>
<br>
<button class="text2">Credit</button>
<br>
<button class="text3">Debit</button> 

</body>
</html>
