<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#0f172a);
color:white;
}

/* NAVBAR */

header{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:92%;
padding:18px 50px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border-radius:20px;
border:1px solid rgba(255,255,255,.1);
z-index:1000;
}

.logo{
font-size:32px;
font-weight:700;
color:#38bdf8;
}

nav a{
color:white;
text-decoration:none;
margin-left:35px;
font-weight:500;
transition:.3s;
}

nav a:hover{
color:#38bdf8;
}

/* HERO */

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:0 10%;
}

.hero-content{
max-width:850px;
}

.hero h3{
color:#38bdf8;
font-size:22px;
margin-bottom:15px;
}

.hero h1{
font-size:70px;
margin-bottom:20px;
}

.hero h1 span{
color:#38bdf8;
}

.hero p{
font-size:20px;
line-height:1.8;
color:#cbd5e1;
margin-bottom:40px;
}

.buttons a{
display:inline-block;
padding:15px 35px;
margin:10px;
border-radius:50px;
text-decoration:none;
font-weight:600;
transition:.3s;
}

.btn1{
background:#38bdf8;
color:#0f172a;
background:linear-gradient(135deg,#3b82f6,#06b6d4);
}

.btn2{
border:2px solid #38bdf8;
color:white;
border:2px solid #38bdf8;
}


.buttons a:hover{
transform:translateY(-5px);
}

/* Theme Button */

#themeToggle{
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    font-size:22px;
    background:#38bdf8;
    color:#fff;
    transition:.3s;
}

#themeToggle:hover{
    transform:rotate(180deg);
}

/* Light Theme */

body.light{
    background:#f5f7fa;
    color:#111827;
}

body.light header{
    background:rgba(255,255,255,.85);
    border:1px solid rgba(0,0,0,.1);
}

body.light nav a{
    color:#111827;
}

body.light .logo{
    color:#0ea5e9;
}

body.light .hero p{
    color:#4b5563;
}

body.light .btn2{
    color:#111827;
    border:2px solid #0ea5e9;
}

</style>
</head>

<body>
    <button id="themeToggle">🌙</button>

<header>

<div class="logo">
Muhammad
</div>

<nav>

<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Skills</a>
<a href="#">Projects</a>
<a href="#">Contact</a>

</nav>

</header>

<section class="hero">

<div class="hero-content">

<h3>Hello, I'm</h3>

<h1>Muhammad <span>Bin Abdullah</span></h1>

<p>
I'm a Front-End Web Developer passionate about creating modern,
responsive, and user-friendly websites using HTML, CSS, JavaScript,
and Bootstrap.
</p>

<div class="buttons">

<a href="#" class="btn1">View Projects</a>

<a href="#" class="btn2">Contact Me</a>

</div>

</div>

</section>

<script>

const toggle=document.getElementById("themeToggle");

toggle.onclick=function(){

document.body.classList.toggle("light");

if(document.body.classList.contains("light")){

toggle.innerHTML="☀️";

}else{

toggle.innerHTML="🌙";

}

}

</script>

</body>
</html>
